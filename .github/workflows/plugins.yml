name: Build plugins

on:
  workflow_dispatch:
  push:
    paths:
      - "plugins/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/plugins.yml"

env:
  RELEASE_TAG: plugins

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace make :generateUpdaterJson
          ls -la plugins/*/build/outputs/ build/outputs/
          cat build/outputs/updater.json

      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          if-no-files-found: error
          path: |
            src/plugins/*/build/outputs/*.zip
            src/build/outputs/updater.json

      # Aliucord's in-app updater reads updater.json + zips from the `builds` branch via jsdelivr
      # (that's what aliucord { github(...) } points updateUrl/buildUrl at).
      - name: Publish to the builds branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git clone --depth 1 --branch builds "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds 2>/dev/null || {
            mkdir builds && cd builds && git init -q && git checkout -q --orphan builds
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            cd ..
          }
          cd builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f ./*.zip updater.json
          cp ../src/plugins/*/build/outputs/*.zip .
          cp ../src/build/outputs/updater.json .
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -q origin builds

      # Also keep a direct-download copy on a moving release, for sideloading without the updater.
      - name: Publish to the plugins release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd src
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "plugins (latest build)" \
            --notes "Built from run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Drop the zip into Internal storage/Aliucord/plugins/ and restart Aliucord." \
            plugins/*/build/outputs/*.zip build/outputs/updater.json
